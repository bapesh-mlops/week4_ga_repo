name: Sanity test
on:
  workflow_dispatch:
  push:
    branches: week_4
permissions:
  contents: write
  pull-requests: write
  id-token: write
jobs:
  test_model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.9"
      - name: Install dependencies and DVC
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install tensorflow==2.20.0 keras==3.10.0
          python -m pip install "dvc[gs]"
          python -m dvc --version
      - uses: iterative/setup-cml@v2
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Pull DVC artifacts
        run: |
          python -m dvc pull data
      - name: Prepare test image
        run: |
          cp "$(find data/train/dogs -type f \( -iname '*.jpg' -o -iname '*.jpeg' \) | shuf -n 1)" samples/sample1.jpg
          test -s samples/sample1.jpg
      - name: Check TensorFlow and Keras versions  
        run: |
          python -c "import tensorflow as tf, keras; print('TensorFlow:', tf.__version__); print('Keras:', keras.__version__)"
      - name: Run unit tests
        run: |
          python -m unittest test -v
      - name: run unit tests
        run: |
          python -m test > test_output.txt 2>&1
      - name: Create CML Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "test output" > report.md
          echo '```' >> report.md
          cat test_output.txt >> report.md
          echo '```' >> report.md
          echo "metrics from training" >> report.md
          cat metrics.csv >> report.md
          cml comment create --publish report.md
